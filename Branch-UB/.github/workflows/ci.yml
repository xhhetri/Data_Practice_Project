name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -v

      - name: Run full pipeline (smoke test on fixture data)
        run: python run_pipeline.py

      - name: Upload generated reports as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            data/processed/
            reports/
          retention-days: 14
